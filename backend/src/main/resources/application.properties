spring.application.name=stockflow-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stockflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:U3RvY2tGbG93RGVtb1NlY3JldEtleUZvckRldmVsb3BtZW50MTIzNDU2Nzg5MA==}
app.jwt.expiration-ms=86400000
app.default-low-stock-threshold=5
